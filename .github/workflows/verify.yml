name: Verify LockQ exactness and archived figures
on: [push, pull_request, workflow_dispatch]

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[verify]'
      - run: python scripts/restore_experiment_dependencies.py
      - run: python -m py_compile experiments/v26/lockq_base.py experiments/v26/LockQ_v25_Robust_Extension.py experiments/v26/LockQ_v26_2_FinalStack.py
      - run: python -m pytest -q tests/test_exact.py
      - run: python scripts/verify_published_results.py
