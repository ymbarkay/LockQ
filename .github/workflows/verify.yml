name: Test LockQ

on: [push, pull_request, workflow_dispatch]

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[verify]"
      - run: python -m py_compile experiments/simulation.py experiments/drift_models.py experiments/run_estimator.py
      - run: python -m pytest -q tests/test_exact.py
      - run: python scripts/verify_published_results.py
