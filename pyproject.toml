[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockq-exact"
version = "0.1.0"
description = "Exact unordered likelihood comparator for finite-shot quantum classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
verify = ["pytest>=7", "pandas>=2"]
full = ["pytest>=7", "pandas>=2", "scipy>=1.10", "torch>=2"]

[tool.setuptools.packages.find]
include = ["lockq*"]